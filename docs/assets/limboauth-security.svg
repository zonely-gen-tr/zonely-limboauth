<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="459" viewBox="0 0 1200 459" role="img" aria-labelledby="title desc">
<title id="title">Güvenlik ve bağlantılar</title>
<desc id="desc">İki aşamalı doğrulama: TOTP ve doğrulayıcı uygulamayla giriş. Premium hesaplar: Premium / offline giriş tercihlerini ayarla. Floodgate bağlantısı: Bedrock giriş seçenekleri; Floodgate gerekir. UUID seçenekleri: Hesap UUID’sini koruma tercihlerini belirle. Eski parola aktarımı: Desteklenen hash’leri girişte bcrypt’e taşı. İstemci modu desteği: Ayrı LimboAuthClientMod ile doğrulama.</desc>
