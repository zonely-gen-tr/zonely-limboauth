<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="567" viewBox="0 0 1200 567" role="img" aria-labelledby="title desc"><title id="title">Login and registration</title><desc id="desc">Registration and login: Confirmation with /register and /login. Virtual Limbo: You do not need a separate auth server for the introduction. Transfer to the lobby: Pass to the game server after verification. Bossbar and headers: Show the input steps and the remaining time. Input time: End the connection when the time is full. Password rules: Length and poor password inspection. The limit of registration per IP: Limit accounts that can be opened from the same IP. False password limit: Set the number of error entries and waiting.</desc><rect width="1200" height="567" fill="#1565C0"/><g fill="#fff" font-family="Segoe UI,Arial,sans-serif"><g data-feather="log-in" transform="translate(52 40) scale(1.5000)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></g><text x="106" y="70" font-size="36" font-weight="700">Login and registration</text><g data-feather="user-plus" transform="translate(52 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></g><text x="96" y="139" font-size="24" font-weight="700">Registration and login</text><text x="96" y="173" font-size="20" font-weight="400">/account verification with /register and /login.</text><g data-feather="server" transform="translate(612 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></g><text x="656" y="139" font-size="24" font-weight="700">Sanal Limbo</text><text x="656" y="173" font-size="20" font-weight="400">No separate authentication server required.</text><g data-feather="send" transform="translate(52 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></g><text x="96" y="247" font-size="24" font-weight="700">Lobby transfer</text><text x="96" y="281" font-size="20" font-weight="400">After verification, switch to the game server.</text><g data-feather="layout" transform="translate(612 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></g><text x="656" y="247" font-size="24" font-weight="700">Bossbar and headers</text><text x="656" y="281" font-size="20" font-weight="400">Show login steps and the remaining time.</text><g data-feather="clock" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g><text x="96" y="355" font-size="24" font-weight="700">Login timeout</text><text x="96" y="389" font-size="20" font-weight="400">End the connection when full of time.</text><g data-feather="key" transform="translate(612 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></g><text x="656" y="355" font-size="24" font-weight="700">Password rules</text><text x="656" y="389" font-size="20" font-weight="400">Length and weak password control.</text><g data-feather="users" transform="translate(52 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="96" y="463" font-size="24" font-weight="700">Record limit per IP</text><text x="96" y="497" font-size="20" font-weight="400">Limit accounts that can be opened from the same IP.</text><g data-feather="slash" transform="translate(612 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></g><text x="656" y="463" font-size="24" font-weight="700">Wrong password limit</text><text x="656" y="497" font-size="20" font-weight="400">Set the number of incorrect entries and waiting.</text></g></svg>