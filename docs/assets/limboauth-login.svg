roke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></g><text x="656" y="247" font-size="24" font-weight="700">Bossbar ve başlıklar</text><text x="656" y="281" font-size="20" font-weight="400">Giriş adımlarını ve kalan süreyi göster.</text><g data-feather="clock" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g><text x="96" y="355" font-size="24" font-weight="700">Giriş süresi</text><text x="96" y="389" font-size="20" font-weight="400">Süre dolunca bağlantıyı sonlandır.</text><g data-feather="key" transform="translate(612 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></g><text x="656" y="355" font-size="24" font-weight="700">Şifre kuralları</text><text x="656" y="389" font-size="20" font-weight="400">Uzunluk ve zayıf parola denetimi.</text><g data-feather="users" transform="translate(52 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></g><text x="96" y="463" font-size="24" font-weight="700">IP başına kayıt sınırı</text><text x="96" y="497" font-size="20" font-weight="400">Aynı IP’den açılabilecek hesapları sınırla.</text><g data-feather="slash" transform="translate(612 439) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></g><text x="656" y="4