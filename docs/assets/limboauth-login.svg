<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="567" viewBox="0 0 1200 567" role="img" aria-labelledby="title desc">
<title id="title">Giriş ve kayıt</title>
<desc id="desc">Kayıt ve giriş: /register ve /login ile hesap doğrulama. Sanal Limbo: Giriş için ayrı bir auth sunucusu gerekmez. Lobiye aktarım: Doğrulamadan sonra oyun sunucusuna geçiş. Bossbar ve başlıklar: Giriş adımlarını ve kalan süreyi göster. Giriş süresi: Süre dolunca bağlantıyı sonlandır. Şifre kuralları: Uzunluk ve zayıf parola denetimi. IP başına kayıt sınırı: Aynı IP’den açılabilecek hesapları sınırla. Yanlış parola sınırı: Hatalı giriş sayısını ve beklemeyi ayarla.</desc>
