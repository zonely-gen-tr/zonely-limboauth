in="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></g><text x="656" y="247" font-size="24" font-weight="700">Hesap silinmesi</text><text x="656" y="281" font-size="20" font-weight="400">Silinen hesabın açık oturumunu sonlandır.</text><g data-feather="check-circle" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g><text x="96" y="355" font-size="24" font-weight="700">Güncel parola kontrolü</text><text x="96" y="389" font-size="20" font-weight="400">Önbellekteki oturumu veritabanıyla doğrula.</text><g data-feather="clock" transform="translate(612 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g><text x="656" y="355" font-size="24" font-weight="700">Oturum süresi</text><text x="656" y="389" font-size="20" font-weight="400">Tekrar giriş önbelleğinin süresini belirle.</text></g>
