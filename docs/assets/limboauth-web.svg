<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="459" viewBox="0 0 1200 459" role="img" aria-labelledby="title desc">
<title id="title">Web hesabı ve oturumlar</title>
<desc id="desc">Ortak userslist tablosu: Zonely / AuthMe hesaplarını birlikte kullan. Bcrypt uyumluluğu: PHP $2y$, $2a$, $2b$ ve AuthMe BCRYPT$. Webden şifre değişikliği: Değişince açık oturumu kapat; varsayılan 5 sn. Hesap silinmesi: Silinen hesabın açık oturumunu sonlandır. Güncel parola kontrolü: Önbellekteki oturumu veritabanıyla doğrula. Oturum süresi: Tekrar giriş önbelleğinin süresini belirle.</desc>
<rect width="1200" height="459" fill="#1565C0"/>
