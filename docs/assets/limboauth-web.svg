<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="459" viewBox="0 0 1200 459" role="img" aria-labelledby="title desc"><title id="title">Web account and sessions</title><desc id="desc">Common userslist chart: Use Zonely/AuthMe accounts together. Bcrypt compatibility: PHP $2y$, $2a$, $2b$ and AuthMe BCRYPT$. Webden password change: Close the open session when Changed; default 5 sec. Account erase: End the open session of the Silinen account. Current password control: verify the session in the cache with the database. Session time: Identify the time of the log cache again.</desc><rect width="1200" height="459" fill="#1565C0"/><g fill="#fff" font-family="Segoe UI,Arial,sans-serif"><g data-feather="link" transform="translate(52 40) scale(1.5000)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></g><text x="106" y="70" font-size="36" font-weight="700">Web account and sessions</text><g data-feather="database" transform="translate(52 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></g><text x="96" y="139" font-size="24" font-weight="700">Ortak userslist tablosu</text><text x="96" y="173" font-size="20" font-weight="400">Use Zonely/AuthMe accounts together.</text><g data-feather="shield" transform="translate(612 115) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></g><text x="656" y="139" font-size="24" font-weight="700">Bcrypt compatibility</text><text x="656" y="173" font-size="20" font-weight="400">PHP $2y$, $2a$, $2b$ ve AuthMe BCRYPT$.</text><g data-feather="refresh-cw" transform="translate(52 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></g><text x="96" y="247" font-size="24" font-weight="700">Web password change</text><text x="96" y="281" font-size="20" font-weight="400">Invalidate sessions after password changes. Default check: 5 s.</text><g data-feather="user-check" transform="translate(612 223) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><polyline points="17 11 19 13 23 9"/></g><text x="656" y="247" font-size="24" font-weight="700">Hesap silinmesi</text><text x="656" y="281" font-size="20" font-weight="400">End the open session of the deleted account.</text><g data-feather="check-circle" transform="translate(52 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></g><text x="96" y="355" font-size="24" font-weight="700">Current password control</text><text x="96" y="389" font-size="20" font-weight="400">Validate the session in the cache with the database.</text><g data-feather="clock" transform="translate(612 331) scale(1.1667)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></g><text x="656" y="355" font-size="24" font-weight="700">Session time</text><text x="656" y="389" font-size="20" font-weight="400">Identify the time of the log cache again.</text></g></svg>