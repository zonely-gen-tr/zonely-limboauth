<title id="title">Yönetim ve özelleştirme</title>
<desc id="desc">MySQL ve MariaDB: Paneldeki ortak hesap veritabanına bağlan. Diğer depolama türleri: PostgreSQL, SQLite ve H2 seçenekleri. Yönetici komutları: Kayıt aç, hesabı sil veya parolayı değiştir. Oturum yönetimi: Zorla giriş ve oturum kapatma komutları. Limbo dünyası: Yapı / schematic, konum ve dünya ayarları. Mesajlar ve dil: Mesajları, başlıkları ve renkleri düzenle.</desc>
